[pytest]
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
norecursedirs =
    .git
    .hermes
    .venv
    __pycache__
    data/backups
    vendor
    target
    sketches
addopts =
    --ignore=data/backups
    --ignore=vendor
    --ignore=target
    --ignore=sketches
