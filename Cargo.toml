[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Eidolon Project"]
rust-version = "1.78"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.37", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# HTTP / Web
axum = { version = "0.7", features = ["ws", "json", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
hyper = { version = "1.3", features = ["full"] }
http = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }

# Crypto
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8"
ring = "0.17"
sha2 = "0.10"
blake3 = "1.5"
x25519-dalek = { version = "2.0", features = ["serde"] }
chacha20poly1305 = "0.10"
aes-gcm = "0.10"

# QUIC
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.1"

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.6"

# Async utils
futures = "0.3"
async-trait = "0.1"

# CLI / API client (for hybrid mode)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# OpenAPI / Validation
utoipa = { version = "4.2", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "7.0", features = ["axum"] }

# Pattern matching / regex
regex = "1.10"

# Base64 encoding
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
