<!DOCTYPE html>
<html lang="de" data-theme="dark" data-animations="on">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eidolon — Zentrales agentisches Hauptsystem</title>
        <link rel="stylesheet" href="/assets/app-shell.css">
    <link rel="stylesheet" href="/assets/app-components.css">
    <link rel="stylesheet" href="/assets/app-canvas.css">
    <link rel="stylesheet" href="/assets/app-mobile.css">

</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-lockup">
                    <div class="eidolon-signature" id="eidolon-signature" data-eidolon-presence data-presence-engine="still" data-presence-state="idle" data-presence-phase="idle" data-turn-phase="idle" aria-hidden="true">
                        <span class="eidolon-presence-cloud" aria-hidden="true">
                            <picture class="eidolon-presence-picture">
                                <source type="image/webp" srcset="/assets/media/eidolon-presence.webp">
                                <img class="eidolon-presence-still" src="/assets/media/eidolon-presence.png" alt="" width="512" height="512" decoding="async">
                            </picture>
                            <canvas class="eidolon-presence-live" width="96" height="96" hidden aria-hidden="true"></canvas>
                        </span>
                    </div>
                    <div>
                        <h1>Eidolon</h1>
                        <div class="version" id="eidolon-presence-copy">Bereit für neue Arbeit</div>
                    </div>
                </div>
                <div class="presence-meta" id="eidolon-presence-meta">Starte ein Gespräch oder setze bestehende Arbeit fort.</div>
            </div>
            <div class="nav-group-title">Start & Arbeit</div>
            <ul class="nav-list">
                <!--EIDOLON_NAV_SIDEBAR_PRIMARY_BEGIN-->
                <!--EIDOLON_SESSION_RAIL_BEGIN-->
                <li class="chat-session-rail">
                    <input type="text" id="chat-session-search" class="chat-sidebar-search" placeholder="Sessions durchsuchen...">
                    <div class="chat-panel-meta" id="chat-session-summary" style="margin-top:8px;">Lade Sessions…</div>
                    <div id="chat-sessions" class="chat-sidebar-sessions"></div>
                </li>
                <!--EIDOLON_SESSION_RAIL_END-->
                <!--EIDOLON_NAV_SIDEBAR_PRIMARY_END-->
            </ul>
            <details class="nav-disclosure">
                <summary>Mehr</summary>
                <!--EIDOLON_NAV_SIDEBAR_MORE_BEGIN-->
                <!--EIDOLON_NAV_SIDEBAR_MORE_END-->
            </details>
        </aside>
        
        <main class="main">
            <div class="page-header">
                <div>
                    <h2 id="page-title">Eidolon</h2>
                    <div class="subtitle" id="page-subtitle">Starte ein Gespräch oder setze reale Arbeit fort.</div>
                </div>
                <div class="page-actions">
                    <button class="btn-icon" data-ui-action="openTabSettings" title="Bereichs-Einstellungen">⚙️</button>
                </div>
            </div>
            <div id="mobile-device-banner" class="mobile-device-banner"></div>
